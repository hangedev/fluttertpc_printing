name: printing_demo
description: Pdf Printing Demo
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=1.16.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  open_file: ^3.2.1
  open_file_ohos:
    git:
      url: https://gitee.com/openharmony-sig/fluttertpc_open_file.git
      path: ohos
  path_provider:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      path: packages/path_provider/path_provider
  pdf:
  printing:
  url_launcher: 
    git: 
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      path: packages/url_launcher/url_launcher
  vector_math: ^2.1.4

dev_dependencies:
  # flutter_launcher_icons: ^0.10.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  test:

dependency_overrides:
  pdf:
    path: ../pdf
  printing:
    path: ../printing

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_icons:
  image_path: "app-logo.png"
  remove_alpha_ios: true
  android:
    generate: true
  ohos:
    generate: true
  ios:
    generate: true
  web:
    generate: true
  windows:
    generate: true
