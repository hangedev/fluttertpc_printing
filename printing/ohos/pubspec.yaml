name: printing_ohos
description: Plugin that allows Flutter apps to generate and print documents to compatible printers on ohos print.
repository: https://gitcode.com/CPF-Flutter/fluttertpc_printing
version: 1.0.1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  ffi: ">=1.1.0 <3.0.0"
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  http: ">=0.13.0 <2.0.0"
  image: ^4.1.0
  meta: ">=1.3.0 <2.0.0"
  pdf: ^3.10.0
  pdf_widget_wrapper: '>=1.0.4 <2.0.0'
  plugin_platform_interface: ^2.1.0
  web: ^1.0.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4

flutter:
  plugin:
    platforms:
      ohos:
        pluginClass: PrintingPlugin
